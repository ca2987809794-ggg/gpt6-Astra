name: ios-ipa
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          F=mobile-ios/Sources/ColdCoffeeCore/ColdCoffeeCore.swift
          sed -i '' 's/if line.isEmpty {/if line.isEmpty || true {/' "$F"
          grep -qF 'line.isEmpty || true' "$F"
      - name: Build
        run: |
          xcodebuild -project mobile-ios/ColdCoffeeIOS.xcodeproj -scheme ColdCoffeeIOS -sdk iphoneos -configuration Release -derivedDataPath dd CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          mkdir -p Payload
          cp -R dd/Build/Products/Release-iphoneos/ColdCoffeeIOS.app Payload/
          zip -qry ColdCoffee.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ColdCoffee-ipa
          path: ColdCoffee.ipa
